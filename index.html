<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GZY Catalogue 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>

  :root {
    --desk: #1b2130;
    --desk-2: #242c3e;
    --paper: #fafaf7;
    --paper-edge: #eceae3;
    --ink: #141b2d;
    --ink-2: #505a6e;
    --ink-3: #8a93a4;
    --line: #dce1ea;
    --blue: #0b5cd5;
    --blue-soft: #e8f0fc;
    --display: "Archivo", "Noto Sans SC", system-ui, sans-serif;
    --body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 40%, var(--desk-2), var(--desk) 70%);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    padding-inline: 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }

  /* ---------- stage & book ---------- */
  .stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
  .scaler { width: 1040px; height: 700px; transform-origin: center center; flex: none; }
  .book {
    position: relative; width: 1040px; height: 700px;
    perspective: 2600px;
    transition: transform .9s cubic-bezier(.3,.1,.2,1);
  }
  .book.closed-front { transform: translateX(-25%); }
  .book.closed-back { transform: translateX(25%); }
  .book::after { /* soft shadow on the desk */
    content: ""; position: absolute; left: 3%; right: 3%; bottom: -26px; height: 40px;
    background: radial-gradient(50% 50% at 50% 50%, rgba(0,0,0,.45), transparent 70%);
    z-index: -1; transition: left .9s, right .9s;
  }
  .book.closed-front::after { left: 52%; }
  .book.closed-back::after { right: 52%; }

  .leaf {
    position: absolute; top: 0; left: 50%; width: 50%; height: 100%;
    transform-origin: left center; transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.45,.05,.25,1);
    cursor: pointer;
  }
  .leaf.flipped { transform: rotateY(-180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: var(--paper); overflow: hidden;
  }
  .face.back { transform: rotateY(180deg); }
  /* gutter shading: right pages dark on their left edge, left pages on their right edge */
  .face.front::before, .face.back::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 60px; pointer-events: none; z-index: 5;
  }
  .face.front::before { left: 0; background: linear-gradient(90deg, rgba(20,27,45,.16), rgba(20,27,45,0)); }
  .face.back::before { right: 0; background: linear-gradient(270deg, rgba(20,27,45,.16), rgba(20,27,45,0)); }
  /* shading that sweeps across a page while it turns */
  .face::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 6; opacity: 0;
    background: linear-gradient(90deg, rgba(0,0,0,.18), rgba(255,255,255,.08) 60%, rgba(0,0,0,.05));
    transition: opacity .5s;
  }
  .leaf.turning .face::after { opacity: 1; }
  /* stacked page edges */
  .leaf:not(.flipped) .face.front { box-shadow: inset -1px 0 0 var(--paper-edge), 3px 2px 0 -1px #e3e1d9, 6px 4px 0 -2px #d5d3ca; }
  .leaf.flipped .face.back { box-shadow: inset 1px 0 0 var(--paper-edge), -3px 2px 0 -1px #e3e1d9, -6px 4px 0 -2px #d5d3ca; }

  @media (prefers-reduced-motion: reduce) {
    .leaf, .book, .book::after { transition-duration: .01s; }
  }

  /* ---------- page furniture ---------- */
  .pg { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 40px 44px 30px; box-sizing: border-box; }
  .run {
    display: flex; justify-content: space-between; align-items: baseline;
    font: 500 10px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3);
    padding-bottom: 12px; border-bottom: 1px solid var(--line);
  }
  .run b { color: var(--blue); font-weight: 700; }
  .folio {
    margin-top: auto; padding-top: 12px; display: flex; justify-content: space-between;
    font: 500 10px/1 var(--mono); color: var(--ink-3);
  }
  .back .folio { flex-direction: row-reverse; }

  /* ---------- cover ---------- */
  .cover { background: var(--blue); color: #fff; }
  .cover .pg { padding: 48px 46px 40px; }
  .cover .brand { font: 800 15px/1 var(--display); letter-spacing: .32em; }
  .cover .brand span { opacity: .6; font-weight: 500; letter-spacing: .1em; margin-left: 10px; }
  .cover h1 {
    margin: 64px 0 0; font: 800 68px/.92 var(--display); font-stretch: 78%; letter-spacing: -.01em; text-wrap: balance;
  }
  .cover h1 em { font-style: normal; display: block; color: #bcd4fb; }
  .cover .cn { margin-top: 18px; font: 500 22px/1.3 var(--body); letter-spacing: .12em; }
  .cover .hero {
    position: absolute; left: 46px; right: 46px; bottom: 96px; height: 250px;
    background: #fff; border-radius: 2px; display: grid; grid-template-columns: 1.1fr 1fr; overflow: hidden;
  }
  .cover .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .hero .mono { object-fit: contain; padding: 18px; box-sizing: border-box; }
  .cover .foot {
    margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end;
    font: 500 11px/1.5 var(--mono); color: #d7e5fd;
  }
  .cover .foot strong { font: 800 40px/1 var(--display); color: #fff; font-stretch: 80%; }

  /* ---------- intro & contents ---------- */
  .intro h2, .toc h2 { margin: 26px 0 6px; font: 800 38px/1 var(--display); font-stretch: 80%; }
  .intro .lede { font-size: 13.5px; line-height: 1.85; color: var(--ink-2); max-width: 34em; margin: 14px 0 0; }
  .stats { margin-top: 28px; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 2px solid var(--ink); }
  .stats div { padding: 14px 0 0; }
  .stats strong { display: block; font: 800 46px/1 var(--display); font-stretch: 80%; color: var(--blue); font-variant-numeric: tabular-nums; }
  .stats span { font-size: 12px; color: var(--ink-2); }
  .chips { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font: 500 11px/1 var(--mono); padding: 6px 8px; background: var(--blue-soft); color: var(--blue); border-radius: 2px; }
  .intro .note { margin-top: 22px; font-size: 11.5px; line-height: 1.7; color: var(--ink-3); }

  .toc ol { list-style: none; margin: 16px 0 0; padding: 0; }
  .toc li { border-bottom: 1px solid var(--line); }
  .toc button {
    all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 26px 1fr auto; gap: 10px;
    align-items: baseline; padding: 7px 2px; cursor: default;
  }
  .toc .n { font: 500 11px/1 var(--mono); color: var(--ink-3); }
  .toc .t { font-size: 13px; font-weight: 500; }
  .toc .t small { display: block; font: 400 10.5px/1.4 var(--display); color: var(--ink-3); margin-top: 2px; }
  .toc .p { font: 500 11px/1 var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .toc li.live button { cursor: pointer; }
  .toc li.live .t { color: var(--blue); }
  .toc li.live .p::after { content: " →"; color: var(--blue); }
  .toc li.live button:hover { background: var(--blue-soft); }
  .toc button:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  /* ---------- product pages ---------- */
  .kicker { margin-top: 22px; font: 600 11px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--blue); }
  .pname { margin: 8px 0 0; font: 700 25px/1.25 var(--body); text-wrap: balance; }
  .pname-en { margin-top: 4px; font: 500 13px/1.3 var(--display); color: var(--ink-2); }
  .size { font: 800 64px/1 var(--display); font-stretch: 75%; color: var(--ink); letter-spacing: -.02em; margin-top: 12px; }
  .size small { font-size: 22px; font-weight: 600; color: var(--ink-3); margin-left: 2px; }
  .shot { flex: 1; min-height: 0; display: grid; place-items: center; margin: 4px -10px 0; }
  .shot img { max-height: 100%; max-width: 100%; object-fit: contain; mix-blend-mode: multiply; }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 2px solid var(--ink); }
  .keys div { padding: 10px 8px 0 0; }
  .keys dt { font: 500 9.5px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .keys dd { margin: 5px 0 0; font: 500 12px/1.35 var(--mono); }
  .tag { position: absolute; top: 36px; right: 44px; font: 700 10px/1 var(--display); letter-spacing: .14em; background: #d63a2f; color: #fff; padding: 5px 7px; }

  .scene { margin: 18px -44px 0; height: 238px; overflow: hidden; position: relative; }
  .scene img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scene figcaption { position: absolute; left: 44px; bottom: 10px; font: 500 10px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.5); }
  .duo { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; height: 170px; }
  .duo img { width: 100%; height: 100%; object-fit: cover; }
  .acc { margin-top: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .acc figure { margin: 0; text-align: center; }
  .acc img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; border: 1px solid var(--line); mix-blend-mode: multiply; }
  .acc figcaption { font-size: 9.5px; color: var(--ink-2); margin-top: 3px; }

  .spec-h { margin-top: 18px; display: flex; justify-content: space-between; align-items: baseline; }
  .spec-h h3 { margin: 0; font: 700 14px/1 var(--body); }
  .spec-h span { font: 500 10px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
  table.spec { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .spec td { padding: 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 10.5px; line-height: 1.4; }
  .spec td:first-child { width: 34%; color: var(--ink-2); padding-right: 8px; }
  .spec td:first-child small { color: var(--ink-3); margin-left: 4px; }
  .spec td:last-child { font-family: var(--mono); font-size: 10px; color: var(--ink); }
  .spec.tight td { padding: 3px 0; font-size: 10px; }
  .spec.tight td:last-child { font-size: 9.5px; }

  /* ---------- back cover ---------- */
  .backcover { background: var(--ink); color: #dfe5f0; }
  .backcover .pg { padding: 48px 46px 40px; }
  .backcover h2 { margin: 0; font: 800 44px/1 var(--display); font-stretch: 80%; color: #fff; }
  .backcover .zh { margin-top: 8px; font-size: 15px; letter-spacing: .2em; color: #8fb3f2; }
  .backcover dl { margin: 40px 0 0; display: grid; gap: 16px; }
  .backcover dt { font: 500 10px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: #7d889e; }
  .backcover dd { margin: 6px 0 0; font-size: 13px; line-height: 1.6; }
  .backcover .mono { font-family: var(--mono); }
  .backcover .bar { margin-top: auto; height: 10px; background: var(--blue); margin-inline: -46px; margin-bottom: -40px; }

  /* ---------- controls ---------- */
  .controls {
    flex: none; display: flex; align-items: center; justify-content: center; gap: 14px;
    padding-block: 10px calc(14px + env(safe-area-inset-bottom, 0px));
    color: #c9d2e3; font: 500 12px/1 var(--mono);
  }
  .controls button {
    all: unset; cursor: pointer; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.18); color: #fff; font-size: 16px;
  }
  .controls button:hover { background: rgba(255,255,255,.08); }
  .controls button:focus-visible { outline: 2px solid #8fb3f2; outline-offset: 2px; }
  .controls button:disabled { opacity: .3; cursor: default; }
  #pageInfo { min-width: 96px; text-align: center; font-variant-numeric: tabular-nums; }
  .draft {
    position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 16px;
    font: 600 10px/1 var(--display); letter-spacing: .16em; text-transform: uppercase;
    color: #8fb3f2; border: 1px solid rgba(143,179,242,.4); padding: 6px 8px; border-radius: 2px;
  }
  .hint { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: 16px; font-size: 11px; color: #7d889e; }
  @media (max-width: 640px) { .hint { display: none; } }

  body { margin: 0; }   /* the published page gets this from its skeleton; the local copy needs it */

  /* ---------- full-book additions ---------- */
  .viewport { position: relative; }
  .viewport.single { overflow: hidden; }
  .viewport.single .book::after { display: none; }
  .book.show-right { transform: translateX(-25%); }
  .book.show-left { transform: translateX(25%); }

  .pg.fit { --fs: 11.5px; }
  .spec td { font-size: var(--fs, 11.5px); line-height: 1.34; padding-block: calc(var(--fs, 11.5px) * .32); }
  table.spec, .toc ol, .spec-h, .run, .folio { flex: none; }
  .spec td:first-child { font-weight: 500; color: var(--ink-2); }
  .spec td:last-child { font-family: var(--body); font-size: var(--fs, 11.5px); color: var(--ink); }

  /* product shot fills the free space without pushing the key specs */
  .shot { position: relative; flex: 1; min-height: 0; }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .tag { top: 94px; }
  .avail { margin-top: 6px; font: 500 11px/1.3 var(--mono); color: var(--ink-3); }
  .avail b { color: var(--blue); font-weight: 500; }

  .media { margin: 14px -44px 0; height: 230px; display: grid; gap: 6px; flex: none; }
  .media.two { grid-template-columns: 1fr 1fr; margin-inline: 0; }
  .media img { width: 100%; height: 100%; display: block; min-height: 0; }
  .media .cover { object-fit: cover; }
  .media .contain { object-fit: contain; background: #fff; mix-blend-mode: multiply; padding: 6px; box-sizing: border-box; }
  .media.one .contain { background: transparent; }

  .acc.n1, .acc.n2, .acc.n3 { grid-template-columns: repeat(4, 1fr); }
  .acc.n5 { grid-template-columns: repeat(5, 1fr); }
  .shot { margin-top: 8px; margin-bottom: 10px; }

  .cat-mark {
    position: absolute; top: 0; width: 22px; height: 64px; background: var(--blue); color: #fff;
    display: grid; place-items: center; font: 700 10px/1 var(--mono); z-index: 4;
  }
  .front .cat-mark { right: 0; }
  .back .cat-mark { left: 0; }

  .toc { --ts: 13px; }
  .toc h2 { margin-top: 16px; font-size: 32px; }
  .toc ol { margin-top: 8px; }
  .toc li button { cursor: pointer; padding-block: calc(var(--ts) * .38); }
  .toc .t { font-size: var(--ts); line-height: 1.3; }
  .toc .t small { font-size: calc(var(--ts) - 2.5px); margin-top: 1px; }
  .toc .t { color: var(--ink); }
  .toc li button:hover .t { color: var(--blue); }
  .toc .p::after { content: ""; }
  .toc .cnt { font: 500 10px/1 var(--mono); color: var(--ink-3); margin-left: 6px; }

  /* side panel */
  body { flex-direction: row; }
  .stage { min-width: 0; min-height: 0; overflow: hidden; }
  .hint { display: none; }
  .controls {
    flex-direction: column; justify-content: center; align-items: stretch; gap: 14px;
    width: 196px; flex: none; padding-block: 24px; padding-inline: 18px 2px;
    border-left: 1px solid rgba(255,255,255,.08);
  }
  .controls .navrow { display: flex; gap: 10px; }
  .controls #pageInfo { font: 700 22px/1.1 var(--display); color: #fff; text-align: left; min-width: 0; }
  .controls #pageInfo small { display: block; font: 500 11px/1.4 var(--mono); color: #7d889e; margin-top: 4px; }
  .controls .lbl { font: 600 10px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: #7d889e; margin-top: 10px; }
  .controls .side-hint { margin: 10px 0 0; font-size: 11px; line-height: 1.6; color: #7d889e; }
  .controls select {
    width: 100%;
    appearance: none; -webkit-appearance: none; background: transparent; color: #dfe5f0;
    border: 1px solid rgba(255,255,255,.18); border-radius: 19px; height: 38px; padding: 0 30px 0 14px;
    font: 500 12px/1 var(--body); cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, #c9d2e3 50%), linear-gradient(135deg, #c9d2e3 50%, transparent 50%);
    background-position: calc(100% - 16px) 16px, calc(100% - 11px) 16px; background-size: 5px 5px; background-repeat: no-repeat;
  }
  .controls select option { color: #141b2d; }
  .controls select:focus-visible { outline: 2px solid #8fb3f2; outline-offset: 2px; }
  @media (max-width: 760px) {
    body { flex-direction: column; }
    .controls {
      flex-direction: row; align-items: center; justify-content: center; width: auto; gap: 10px;
      border-left: 0; padding-inline: 0; padding-block: 10px calc(14px + env(safe-area-inset-bottom, 0px));
    }
    .controls .lbl, .controls .side-hint { display: none; }
    .controls #pageInfo { font-size: 15px; order: -1; }
    .controls #pageInfo small { display: none; }
    .controls select { width: auto; max-width: 42vw; }
  }

  /* contact block in the side panel */
  .controls .contact { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.1); display: grid; gap: 12px; }
  .controls .c-row { display: block; text-decoration: none; }
  .controls .c-k { display: block; font: 600 10px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: #7d889e; }
  .controls .c-v { display: block; margin-top: 5px; font: 500 13px/1.3 var(--mono); color: #fff; overflow-wrap: anywhere; }
  .controls .c-row:hover .c-v { color: #8fb3f2; }
  .controls .c-btn {
    margin-top: 4px; display: flex; align-items: center; justify-content: center; height: 40px; border-radius: 20px;
    background: var(--blue); color: #fff; text-decoration: none; font: 600 13px/1 var(--display); letter-spacing: .02em;
  }
  .controls .c-btn:hover { background: #1f6de6; }
  .controls .c-row:focus-visible, .controls .c-btn:focus-visible { outline: 2px solid #8fb3f2; outline-offset: 3px; border-radius: 4px; }
  .controls .c-btn:focus-visible { border-radius: 20px; }

  /* language switch */
  .controls .lang {
    display: inline-flex; align-self: flex-start; gap: 2px; padding: 3px; margin-bottom: 18px;
    border: 1px solid rgba(255,255,255,.18); border-radius: 19px;
  }
  .controls .lang button {
    width: auto; height: auto; border: 0; border-radius: 16px; padding: 7px 14px; display: inline-block;
    font: 600 12px/1 var(--body); color: #c9d2e3; cursor: pointer;
  }
  .controls .lang button:hover { background: rgba(255,255,255,.08); }
  .controls .lang button[aria-pressed="true"] { background: #fff; color: #141b2d; }
  @media (max-width: 760px) {
    .controls .lang { margin-bottom: 0; order: -2; align-self: center; }
    .controls .lang button { padding: 6px 10px; }
  }

  /* English copy runs longer than Chinese */
  .cover .cn.en { font: 600 17px/1.3 var(--display); letter-spacing: .08em; text-transform: uppercase; }
  .pname.en { font: 700 23px/1.2 var(--display); font-stretch: 88%; }

  /* ================= phone layout (≤ 760px): one page at a time, reflowed ================= */
  #m { display: none; }
  @media (max-width: 760px) {
    body { padding-inline: 0; flex-direction: column; }
    .stage, .controls { display: none !important; }
    #m { display: flex; flex-direction: column; height: 100%; width: 100%; position: relative; }
  }
  .m-top { flex: none; height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  .m-top .logo { font: 800 14px/1 var(--display); letter-spacing: .3em; color: #fff; }
  .m-top .logo small { font-weight: 500; letter-spacing: .08em; color: #7d889e; margin-left: 6px; }
  .m-lang { display: inline-flex; padding: 2px; border: 1px solid rgba(255,255,255,.2); border-radius: 17px; }
  .m-lang button { all: unset; cursor: pointer; padding: 7px 12px; border-radius: 14px; font: 600 12px/1 var(--body); color: #c9d2e3; }
  .m-lang button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .m-lang button:focus-visible, .m-bottom button:focus-visible, .m-sheet button:focus-visible { outline: 2px solid #8fb3f2; outline-offset: 2px; }

  .m-stage { flex: 1; min-height: 0; position: relative; margin: 0 12px; perspective: 1600px; }
  .mpage {
    position: absolute; inset: 0; background: var(--paper); color: var(--ink); border-radius: 4px 10px 10px 4px; overflow: hidden;
    transform-origin: left center; transition: transform .6s cubic-bezier(.45,.05,.25,1), opacity .6s;
    box-shadow: inset 10px 0 18px -12px rgba(20,27,45,.35), 4px 3px 0 -1px #e3e1d9, 7px 5px 0 -2px #d0cec5;
    touch-action: pan-y;
  }
  .mpage.gone { transform: rotateY(-100deg); opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .mpage { transition-duration: .01s; } }
  .mpage .in { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 18px 20px; display: flex; flex-direction: column; box-sizing: border-box; }
  .mpage .run { flex: none; font-size: 9.5px; padding-bottom: 10px; }
  .mpage .run span { max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mpage .folio { flex: none; font-size: 10px; }

  .mpage.cover { background: var(--blue); color: #fff; }
  .mpage.cover .in { padding: 26px 22px 22px; }

function build() {

// shrink the scene strip, then the table type, until each spec page fits
function fitAll() {
  document.querySelectorAll('.pg.toc').forEach(pg => {
    let ts = 13;
    pg.style.setProperty('--ts', ts + 'px');
    while (pg.scrollHeight > pg.clientHeight + 1 && ts > 9) pg.style.setProperty('--ts', (ts -= .25) + 'px');
  });
  document.querySelectorAll('.pg.fit').forEach(pg => {
    const media = pg.querySelector('.media');
    const over = () => pg.scrollHeight > pg.clientHeight;
    let fs = 11.5, guard = 0;
    pg.style.setProperty('--fs', fs + 'px');
    if (media) { media.style.height = ''; media.hidden = false; }
    // 1) trim the photo strip, 2) tighten the table, 3) drop the photos, 4) tighten further
    while (over() && guard++ < 200) {
      if (media && !media.hidden && media.offsetHeight > 150) media.style.height = (media.offsetHeight - 10) + 'px';
      else if (fs > 9.5) pg.style.setProperty('--fs', (fs -= .25) + 'px');
      else if (media && !media.hidden && media.offsetHeight > 110) media.style.height = (media.offsetHeight - 10) + 'px';
      else if (fs > 8.75) pg.style.setProperty('--fs', (fs -= .25) + 'px');
      else if (media && !media.hidden) media.hidden = true;
      else if (fs > 8) pg.style.setProperty('--fs', (fs -= .25) + 'px');
      else break;
    }
  });
}

// ---------- navigation ----------
function setFlipped(target) {
  if (target === flipped) return;
  const dir = target > flipped ? 1 : -1;
  const moving = dir > 0 ? leaves.slice(flipped, target) : leaves.slice(target, flipped).reverse();
  const shown = moving.length > 8 ? [...moving.slice(0, 4), ...moving.slice(-4)] : moving;
  moving.forEach(leaf => { if (!shown.includes(leaf)) leaf.classList.toggle('flipped', dir > 0); });
  shown.forEach((leaf, k) => setTimeout(() => {
    leaf.classList.add('turning');
    leaf.style.zIndex = 500 + k;
    leaf.classList.toggle('flipped', dir > 0);
    setTimeout(() => leaf.classList.remove('turning'), 900);
  }, k * 110));
  flipped = target;
  clearTimeout(setFlipped.t);
  setFlipped.t = setTimeout(restack, shown.length * 110 + 950);
}
function restack() {
  leaves.forEach((leaf, i) => {
    leaf.classList.toggle('flipped', i < flipped);
    leaf.style.zIndex = i < flipped ? i + 1 : leaves.length - i;
  });
}

function show(n) {
  n = Math.max(1, Math.min(TOTAL, n));
  if (!single && n > 1 && n < TOTAL && n % 2) n -= 1;   // spreads start on even pages
  cur = n;
  setFlipped(leavesFor(n));
  book.classList.remove('closed-front', 'closed-back', 'show-left', 'show-right');
  if (single) book.classList.add(n % 2 ? 'show-right' : 'show-left');
  else if (flipped === 0) book.classList.add('closed-front');
  else if (flipped === leaves.length) book.classList.add('closed-back');
  const L = t();
  const label = n === 1 ? L.cover : n === TOTAL ? L.back : single ? `${n}` : `${n}–${n + 1}`;
  info.innerHTML = `${label}<small>${L.pages(TOTAL)}</small>`;
  prevBtn.disabled = n === 1;
  nextBtn.disabled = n === TOTAL || (!single && n + 1 >= TOTAL && n !== 1);
  let sel = 1;
  [...jump.options].forEach(o => { if (+o.value <= n + (single ? 0 : 1)) sel = +o.value; });
  jump.value = String(sel);
}
const step = d => {
  if (mq.matches) return mShow(mCur + d);
  if (single) return show(cur + d);
  if (d > 0) show(cur === 1 ? 2 : cur + 2);
  else show(cur <= 2 ? 1 : cur - 2);
};

function setLang(l) {
  if (l === lang) return;
  lang = l;
  try { localStorage.setItem('gzy-lang', l); } catch (e) {}
  build();
  mBuild();
  setTimeout(fitAll, 300);
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

let sx = null, suppress = false;
book.addEventListener('click', e => {
  if (suppress) { suppress = false; return; }
  const go = e.target.closest('[data-go]');
  if (go) return show(+go.dataset.go);
  const face = e.target.closest('.face');
  if (!face) return;
  step(face.classList.contains('back') ? -1 : 1);
});
prevBtn.onclick = () => step(-1);
nextBtn.onclick = () => step(1);
jump.onchange = () => show(+jump.value);
addEventListener('keydown', e => {
  if (e.target === jump) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') step(1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') step(-1);
  if (e.key === 'Home') mq.matches ? mShow(1) : show(1);
  if (e.key === 'End') mq.matches ? mShow(TOTAL) : show(TOTAL);
});
book.addEventListener('pointerdown', e => { sx = e.clientX; });
book.addEventListener('pointerup', e => {
  if (sx === null) return;
  const dx = e.clientX - sx; sx = null;
  if (Math.abs(dx) > 40) { suppress = true; step(dx < 0 ? 1 : -1); }
});

// fit the fixed-size book to the window; narrow screens get one page at a time
function fit() {
  const w = stage.clientWidth, h = stage.clientHeight;
  const wantSingle = w < 760;
  const pageW = 520, pageH = 700, bookW = wantSingle ? pageW : pageW * 2;
  const s = Math.min(w / (bookW + (wantSingle ? 0 : 60)), h / (pageH + 40), 1.25);
  scaler.style.width = bookW + 'px';
  scaler.style.transform = 'none';
  scaler.style.margin = '0';
  scaler.style.height = pageH + 'px';
  scaler.style.zoom = s;
  viewport.style.width = bookW + 'px';
  viewport.style.height = pageH + 'px';
  viewport.classList.toggle('single', wantSingle);
  book.style.marginLeft = wantSingle ? `-${pageW / 2}px` : '0';
  if (wantSingle !== single) { single = wantSingle; show(cur); }
}

    el.dataset.cat = cat || '';
    el.style.zIndex = pages.length - i;
    el.innerHTML = `<div class="in">${html}</div>` + (kind === 'spec' ? `<div class="cue">${M.scroll(nSpec)}</div>` : '');
    if (kind === 'spec') {
      const inner = el.firstElementChild, cue = el.lastElementChild;
      const upd = () => { cue.style.opacity = inner.scrollHeight - inner.scrollTop - inner.clientHeight > 24 ? 1 : 0; };
      inner.addEventListener('scroll', upd, { passive: true });
      el._cue = upd;
    }
    mStage.append(el);
    return el;
  });

  document.getElementById('mSheetTitle').textContent = M.sheet;
  const items = [[1, M.front], ...DATA.cats.map(c => [c.page, `${pad(c.no)} ${short(c.no)}`, c.no]), [TOTAL, M.contact]];
  mSheetList.innerHTML = items.map(([pg, label, cat]) =>
    `<li><button type="button" data-go="${pg}" data-cat="${cat || ''}">${esc(label)}<span>p.${pg}</span></button></li>`).join('');
  mShow(mq.matches ? mCur : cur, true);
}

function mShow(n, instant) {
  n = Math.max(1, Math.min(TOTAL, n));
  const far = instant || Math.abs(n - mCur) > 1;
  mCur = n;
  cur = n;
  mPages.forEach((el, i) => {
    const p = i + 1;
    if (far) el.style.transition = 'none';
    el.classList.toggle('gone', p < n);
    el.style.display = p >= n - 1 && p <= n + 1 ? '' : 'none';
    if (far) { void el.offsetWidth; el.style.transition = ''; }
  });
  const here = mPages[n - 1];
  if (here._cue) { here.firstElementChild.scrollTop = 0; requestAnimationFrame(here._cue); }
  const L = t(), M = MT[lang];
  const label = n === 1 ? L.cover : n === TOTAL ? L.back : String(n);
  mInfo.innerHTML = `${label}<small>${L.pages(TOTAL)}</small>`;
  mPrev.disabled = n === 1;
  mNext.disabled = n === TOTAL;
  mPrev.setAttribute('aria-label', L.prev);
  mNext.setAttribute('aria-label', L.next);
  const cat = +here.dataset.cat;
  mCatLabel.textContent = cat ? short(cat) : M.cats;
  mSheetList.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', String(!!cat && +b.dataset.cat === cat)));
}

function mSheetOpen(open) {
  mSheet.hidden = mDim.hidden = !open;
  if (open) (mSheetList.querySelector('[aria-current="true"]') || mSheetList.querySelector('button')).focus();
  else document.getElementById('mCatBtn').focus();
}
mPrev.onclick = () => mShow(mCur - 1);
mNext.onclick = () => mShow(mCur + 1);
document.getElementById('mCatBtn').onclick = () => mSheetOpen(true);
mDim.onclick = () => mSheetOpen(false);
mSheetList.addEventListener('click', e => {
  const b = e.target.closest('[data-go]');
  if (!b) return;
  mSheet.hidden = mDim.hidden = true;
  mShow(+b.dataset.go);
});
mStage.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) mShow(+go.dataset.go);
});
// a horizontal swipe turns the page; vertical movement is left to scrolling
let mx = null, my = null;
mStage.addEventListener('pointerdown', e => { mx = e.clientX; my = e.clientY; });
mStage.addEventListener('pointerup', e => {
  if (mx === null) return;
  const dx = e.clientX - mx, dy = e.clientY - my;
  mx = my = null;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) mShow(mCur + (dx < 0 ? 1 : -1));
});
mStage.addEventListener('pointercancel', () => { mx = my = null; });
addEventListener('keydown', e => {
  if (mq.matches && e.key === 'Escape' && !mSheet.hidden) mSheetOpen(false);
});
mq.addEventListener('change', () => {
  if (mq.matches) mShow(cur, true);
  else { flipped = leavesFor(cur); restack(); show(cur); fit(); fitAll(); }
});

addEventListener('resize', fit);
fit();
build();
mBuild();
if (document.fonts) {
  document.fonts.ready.then(fitAll);
  document.fonts.addEventListener('loadingdone', fitAll);
}
addEventListener('load', fitAll);
setTimeout(fitAll, 1500);
setTimeout(fitAll, 4000);
</script>
